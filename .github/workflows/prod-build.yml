name: Build Package Artifact

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      tag_name:
        description: 'GitHub release tag'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      tag_name:
        description: 'GitHub release tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build
        run: wasm-pack build --target web --release --out-dir pkg --out-name cipher_wasm --scope startcloud

      - name: Package and upload cipher-wasm artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f pkg/.gitignore
          tar -czf "cipher-wasm-${{ inputs.version }}.tar.gz" -C pkg .
          sha256sum "cipher-wasm-${{ inputs.version }}.tar.gz" > SHA256SUMS.txt
          gh release upload "${{ inputs.tag_name }}" "cipher-wasm-${{ inputs.version }}.tar.gz" SHA256SUMS.txt --clobber
