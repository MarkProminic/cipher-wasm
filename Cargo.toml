[package]
name = "cipher-wasm"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
der = { version = "0.8", features = ["alloc", "oid", "pem", "derive"] }
spki = { version = "0.8", features = ["alloc", "pem"] }
x509-cert = { version = "0.3", default-features = false, features = ["pem", "builder"] }
pkcs1 = { version = "0.8.0-rc.5", features = ["alloc", "pem"] }
pkcs8 = { version = "0.11", features = ["alloc", "pem", "encryption", "3des", "des-insecure", "sha1-insecure"] }
pkcs5 = { version = "0.8", features = ["alloc", "pbes2", "3des", "des-insecure", "sha1-insecure"] }
pkcs12 = { version = "0.2.0-pre.0", features = ["kdf"] }
cms = { version = "=0.3.0-pre.1", default-features = false, features = ["std"] }
rsa = { version = "0.10.0-rc.19", features = ["sha2", "sha1"] }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "alloc"] }
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "alloc"] }
p521 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "alloc"] }
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "alloc"] }
ecdsa = { version = "0.17", default-features = false, features = ["der", "pkcs8", "alloc"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8", "rand_core", "zeroize"] }
ed25519 = { version = "3", default-features = false, features = ["alloc", "pkcs8"] }
ed448-goldilocks = { version = "0.14.0-pre.15", default-features = false, features = ["alloc", "pkcs8", "signing"] }
ssh-key = { version = "0.7.0-rc.11", default-features = false, features = ["alloc", "ecdsa", "ed25519", "rsa", "p256", "p384", "p521", "encryption"] }
signature = { version = "3", features = ["alloc"] }
rand_core = "0.10"
getrandom = { version = "0.4", features = ["wasm_js", "sys_rng"] }
crypto-bigint = { version = "0.7", features = ["alloc"] }
sha1 = { version = "0.11", default-features = false, features = ["oid"] }
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
md5 = { version = "0.8", default-features = false }
hmac = "0.13"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
aes = "0.9"
des = "0.9"
rc2 = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
cipher = { version = "0.5", features = ["alloc", "block-padding"] }
digest = { version = "0.11", features = ["alloc"] }
const-oid = { version = "0.10", features = ["db"] }
base64ct = { version = "1", features = ["alloc"] }
pem-rfc7468 = { version = "1", features = ["alloc"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
