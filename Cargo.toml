[package]
name = "cipher-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
der = { version = "0.7", features = ["alloc", "oid", "pem", "derive"] }
spki = { version = "0.7", features = ["alloc", "pem"] }
x509-cert = { version = "0.2", default-features = false, features = ["pem", "builder"] }
pkcs1 = { version = "0.7", features = ["alloc", "pem", "pkcs8"] }
pkcs8 = { version = "0.11", features = ["alloc", "pem", "encryption", "3des", "des-insecure", "sha1-insecure"] }
pkcs5 = { version = "0.7", features = ["alloc", "pbes2", "3des", "des-insecure", "sha1-insecure"] }
pkcs12 = { version = "0.1", features = ["kdf"] }
cms = { version = "0.2", default-features = false, features = ["alloc", "pem", "std"] }
rsa = { version = "0.9", features = ["sha2", "sha1"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "alloc"] }
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "alloc"] }
ecdsa = { version = "0.16", default-features = false, features = ["der", "pkcs8", "alloc", "verifying", "signing"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "pkcs8", "rand_core", "zeroize"] }
ed25519 = { version = "2", default-features = false, features = ["alloc", "pkcs8"] }
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ecdsa", "ed25519", "rsa", "p256", "p384", "encryption"] }
signature = { version = "2", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
sha1 = { version = "0.10", default-features = false, features = ["oid"] }
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
md5 = { version = "0.7", default-features = false }
hmac = "0.12"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aes = "0.8"
des = "0.8"
rc2 = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
digest = { version = "0.10", features = ["alloc"] }
const-oid = { version = "0.9", features = ["db"] }
base64ct = { version = "1", features = ["alloc"] }
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
